<div style="font-family:Arial;padding:20px;max-width:500px;margin:auto">

<h2>ระบบน้องรหัส</h2>

<select id="person"></select>

<button onclick="showResult()">
ดูผล
</button>

<h3 id="result"></h3>

</div>

<script>

let people=[];

for(let i=1;i<=40;i++){
people.push({
name:`6/2 เลขที่ ${i}`
});
}

for(let i=1;i<=40;i++){
people.push({
name:`6/7 เลขที่ ${i}`
});
}

for(let i=1;i<=39;i++){
people.push({
name:`6/9 เลขที่ ${i}`
});
}

function shuffle(arr){

for(let i=arr.length-1;i>0;i--){

let j=Math.floor(
Math.random()*(i+1)
);

[arr[i],arr[j]]=
[arr[j],arr[i]];

}

return arr;

}

let saved=
localStorage.getItem(
"nongsave"
);

let assign;

if(saved){

assign=
JSON.parse(saved);

}
else{

assign=[];

for(let i=0;i<16;i++)
assign.push(3);

for(let i=0;i<103;i++)
assign.push(4);

shuffle(assign);

localStorage.setItem(
"nongsave",
JSON.stringify(assign)
);

}

let select=
document.getElementById(
"person"
);

people.forEach((p,i)=>{

select.innerHTML+=
`<option value="${i}">
${p.name}
</option>`;

});

function showResult(){

let i=select.value;

document.getElementById(
"result"
).innerHTML=

people[i].name+
"<br><br>ได้น้องรหัส "+
assign[i]+
" คน";

}

</script>
